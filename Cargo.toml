[workspace]
resolver = "3"
members = ["crates/migratr", "crates/migratr-format", "crates/migratr-macros", "crates/migratr-cli", "crates/migratr-oracle"]
exclude = ["tests/fixtures/sqlx-coexist"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/rafters-studio/migratr"
authors = ["Rafters Studio"]

[workspace.dependencies]
migratr = { path = "crates/migratr", version = "0.1.2" }
migratr-format = { path = "crates/migratr-format", version = "0.1.2" }
migratr-macros = { path = "crates/migratr-macros", version = "0.1.2" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
