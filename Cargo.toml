[workspace]
resolver = "3"
members = ["crates/migratr", "crates/migratr-macros", "crates/migratr-cli", "crates/migratr-oracle"]
exclude = ["tests/fixtures/sqlx-coexist"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
migratr = { path = "crates/migratr" }
migratr-macros = { path = "crates/migratr-macros" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
