[workspace]
resolver = "3"
members = ["crates/migratr", "crates/migratr-cli", "crates/migratr-oracle"]
exclude = ["tests/fixtures/sqlx-coexist"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
migratr = { path = "crates/migratr" }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
