name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: migratr-linux-x64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: migratr-macos-x64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: migratr-macos-arm64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: migratr-windows-x64
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p migratr-cli

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.${{ matrix.ext }} migratr

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.${{ matrix.ext }} migratr.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 | \
            xargs -0 sha256sum | sed 's|  \./[^/]*/|  |' > ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            checksums.txt

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Refuse before anything is published: the tag must name the version
      # in [workspace.package].
      - name: Check tag matches workspace version
        run: |
          version="$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]") }
            in_pkg && /^version[[:space:]]*=/ { split($0, parts, "\""); print parts[2]; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::no version found in [workspace.package] of Cargo.toml"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version v$version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Dependency order: format and macros have no internal deps, migratr
      # needs both, the CLI needs migratr. A crate whose version is already
      # on crates.io counts as published, so a run that failed partway can
      # be re-run and publishes only what is missing. A false "not
      # published" is safe (the publish is attempted and "already exists"
      # is success); a false "published" is not, so lookups fail toward
      # attempting.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          publish_crate() {
            crate="$1"
            version="$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version')"
            if [ -z "$version" ]; then
              echo "::error::publish failed for $crate: not found in the workspace"
              return 1
            fi

            case "${#crate}" in
              1) index_path="1/$crate" ;;
              2) index_path="2/$crate" ;;
              3) index_path="3/${crate:0:1}/$crate" ;;
              *) index_path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac

            if body="$(curl -sf --max-time 30 "https://index.crates.io/$index_path")" \
              && printf '%s' "$body" | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
              echo "$crate@$version already on crates.io, skipping"
              return 0
            fi

            echo "publishing $crate@$version"
            if output="$(cargo publish -p "$crate" 2>&1)"; then
              echo "$output"
              return 0
            fi
            echo "$output"
            if printf '%s' "$output" | grep -q "already exists"; then
              echo "$crate@$version was already published; treating as success"
              return 0
            fi
            echo "::error::publish failed for $crate@$version"
            return 1
          }

          for crate in migratr-format migratr-macros migratr migratr-cli; do
            publish_crate "$crate"
          done
