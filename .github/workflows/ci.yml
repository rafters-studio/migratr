name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # migratr dev runs smugglr exec; v0.6.3 is the first smugglr release with it.
      - run: cargo install --git https://github.com/rafters-studio/smugglr --tag v0.6.3 smugglr --locked
      - run: echo "SMUGGLR=$HOME/.cargo/bin/smugglr" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-release.sh

  sqlx-coexist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/fixtures/sqlx-coexist
      - run: cargo build --manifest-path tests/fixtures/sqlx-coexist/Cargo.toml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  install-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-install.sh

  install-test-windows:
    strategy:
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release with install.ps1
        run: Get-Content -Raw install.ps1 | Invoke-Expression
      - name: Install again, replacing the first install
        run: Get-Content -Raw install.ps1 | Invoke-Expression
      - name: A failed install leaves the earlier install as it was
        env:
          MIGRATR_VERSION: v0.0.0-missing
        run: |
          $target = Join-Path $HOME '.local\bin\migratr.exe'
          $before = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          $threw = $false
          try {
            Get-Content -Raw install.ps1 | Invoke-Expression
          } catch {
            $threw = $true
            Write-Host "caught: $($_.Exception.Message)"
          }
          if (-not $threw) { throw 'install.ps1 did not stop on a missing release' }
          $after = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          Write-Host "sha256 before: $before"
          Write-Host "sha256 after:  $after"
          if ($after -ne $before) { throw 'migratr.exe changed after a failed install' }
          $left = Get-ChildItem -LiteralPath (Split-Path $target) -Filter 'migratr.staged*'
          if ($left) { throw "staged file left behind: $($left.Name)" }
          Write-Host 'no staged file left beside migratr.exe'
      - name: migratr --version from the user PATH
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          migratr --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
